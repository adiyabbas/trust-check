<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TrustCheck Architecture</title>
<meta name="description" content="Interactive, drill-down explanation of how TrustCheck AI works: scam check, AI-writing check, rules, scoring, LLM layer, API and UI." />
<style>
:root {
  --bg: #fcf7f8;
  --surface: #ffffff;
  --surface-2: #f8ecef;
  --text: #191214;
  --muted: #6e5e64;
  --border: #ebd8dc;
  --primary: #2563eb;
  --shadow: 0 1px 2px rgba(40,16,24,.05), 0 8px 24px rgba(40,16,24,.07);
  --k-actor: #0e9f6e;  --k-ui: #2563eb;  --k-api: #0891b2;  --k-engine: #d97706;
  --k-ai: #1d4ed8;     --k-llm: #7c3aed; --k-data: #475569; --k-link: #ea580c;
  --high: #dc2626; --medium: #d97706; --low: #16a34a;
  --radius: 14px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #120b0d; --surface: #1a1013; --surface-2: #25171c; --text: #faedf0; --muted: #a8949a;
    --border: #3b232a; --primary: #60a5fa; --shadow: 0 1px 2px rgba(0,0,0,.4);
    --k-actor: #34d399; --k-ui: #60a5fa; --k-api: #22d3ee; --k-engine: #fbbf24;
    --k-ai: #60a5fa; --k-llm: #a78bfa; --k-data: #94a3b8; --k-link: #fb923c;
  }
}
:root[data-theme="dark"] {
  --bg: #120b0d; --surface: #1a1013; --surface-2: #25171c; --text: #faedf0; --muted: #a8949a;
  --border: #3b232a; --primary: #60a5fa; --shadow: 0 1px 2px rgba(0,0,0,.4);
  --k-actor: #34d399; --k-ui: #60a5fa; --k-api: #22d3ee; --k-engine: #fbbf24;
  --k-ai: #60a5fa; --k-llm: #a78bfa; --k-data: #94a3b8; --k-link: #fb923c;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
h1, h2, h3, h4 { margin: 0; letter-spacing: -.01em; }
code { font-family: var(--mono); font-size: .84em; background: var(--surface-2); padding: .1em .35em; border-radius: 5px; }
pre { font-family: var(--mono); font-size: .8rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: .8rem; overflow-x: auto; margin: .6rem 0; line-height: 1.5; }
a { color: var(--primary); }
button { font: inherit; color: inherit; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.top-inner { max-width: 1440px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: .7rem; margin-right: auto; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 800; }
.brand h1 { font-size: 1.1rem; }
.brand p { margin: 0; font-size: .8rem; color: var(--muted); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: .35rem .85rem; border-radius: 999px; cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--primary); color: #fff; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: .4rem .7rem; cursor: pointer; font-size: .85rem; }
.icon-btn:hover { border-color: var(--primary); }

/* Shell */
.shell { max-width: 1440px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 16px; align-items: start; }
@media (max-width: 1050px) { .shell { grid-template-columns: 1fr; } }

/* Breadcrumb */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem; font-size: .88rem; margin-bottom: .75rem; }
.crumbs button { border: 0; background: none; padding: .2rem .45rem; border-radius: 7px; cursor: pointer; color: var(--primary); font-weight: 600; }
.crumbs button:hover { background: var(--surface-2); }
.crumbs .sep { color: var(--muted); }
.crumbs .cur { padding: .2rem .45rem; font-weight: 700; }

/* Canvas */
.canvas { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.25rem 1.25rem 1.75rem; min-height: 70vh; position: relative; overflow: hidden; }
.canvas::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 22px 22px; opacity: .55; pointer-events: none; }
.level-head { position: relative; display: flex; gap: .9rem; align-items: flex-start; margin-bottom: 1.2rem; }
.level-head .lh-icon { width: 44px; height: 44px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 1.3rem; color: #fff; }
.level-head h2 { font-size: 1.25rem; }
.level-head p { margin: .2rem 0 0; color: var(--muted); max-width: 70ch; }
.up-btn { margin-left: auto; flex: none; }

.flow { position: relative; display: flex; flex-direction: column; align-items: center; }
.flow.enter { animation: zoomIn .32s ease both; }
.flow.leave { animation: zoomOut .32s ease both; }
@keyframes zoomIn { from { opacity: 0; transform: scale(.94) translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes zoomOut { from { opacity: 0; transform: scale(1.05) translateY(-8px); } to { opacity: 1; transform: none; } }

.row { display: flex; justify-content: center; gap: 18px; width: 100%; flex-wrap: wrap; position: relative; }
.row-label { position: relative; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 0 0 .4rem; background: var(--surface); padding: 0 .5rem; }

.connector { position: relative; height: 38px; width: 100%; display: flex; justify-content: center; }
.connector svg { overflow: visible; }
.connector path { stroke: var(--muted); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; animation: dash 1.2s linear infinite; }
.connector .head { fill: var(--muted); stroke: none; animation: none; }
.connector .tag { position: absolute; top: 9px; left: calc(50% + 12px); font-size: .72rem; color: var(--muted); background: var(--surface); padding: 0 .35rem; border-radius: 6px; white-space: nowrap; font-family: var(--mono); }
@keyframes dash { to { stroke-dashoffset: -18; } }
@media (prefers-reduced-motion: reduce) { .connector path, .flow.enter, .flow.leave { animation: none; } }

/* Node */
.node {
  --k: var(--k-ui);
  position: relative; width: 236px; text-align: left; background: var(--surface); border: 1px solid var(--border);
  border-top: 4px solid var(--k); border-radius: 12px; padding: .75rem .85rem .8rem; cursor: pointer; box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.node:hover { transform: translateY(-2px); border-color: var(--k); }
.node:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.node.selected { border-color: var(--k); box-shadow: 0 0 0 3px color-mix(in srgb, var(--k) 25%, transparent), var(--shadow); }
.node .n-top { display: flex; align-items: center; gap: .55rem; }
.node .n-icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--k) 15%, transparent); color: var(--k); font-size: 1rem; flex: none; }
.node .n-title { font-weight: 700; font-size: .95rem; line-height: 1.25; }
.node .n-sub { font-size: .8rem; color: var(--muted); margin-top: .35rem; line-height: 1.4; }
.node .n-foot { display: flex; justify-content: space-between; align-items: center; margin-top: .55rem; gap: .5rem; }
.chip { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--k); }
.drill { font-size: .72rem; font-weight: 700; color: #fff; background: var(--k); border-radius: 999px; padding: .1rem .5rem; white-space: nowrap; }
.leaf { font-size: .72rem; color: var(--muted); }
.k-actor { --k: var(--k-actor); } .k-ui { --k: var(--k-ui); } .k-api { --k: var(--k-api); } .k-engine { --k: var(--k-engine); }
.k-ai { --k: var(--k-ai); } .k-llm { --k: var(--k-llm); } .k-data { --k: var(--k-data); } .k-link { --k: var(--k-link); }

.legend { position: relative; display: flex; flex-wrap: wrap; gap: .4rem .9rem; margin-top: 1.6rem; padding-top: .9rem; border-top: 1px dashed var(--border); font-size: .78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: .35rem; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--k); display: inline-block; }
.hint { position: relative; text-align: center; font-size: .82rem; color: var(--muted); margin-top: 1rem; }

/* Detail panel */
.panel { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
@media (max-width: 1050px) { .panel { position: static; max-height: none; } }
.p-head { --k: var(--primary); padding: 1rem 1.1rem .9rem; border-bottom: 1px solid var(--border); border-top: 5px solid var(--k); border-radius: var(--radius) var(--radius) 0 0; }
.p-head .chip { display: block; margin-bottom: .25rem; }
.p-head h3 { font-size: 1.15rem; }
.p-head p { margin: .35rem 0 0; color: var(--muted); font-size: .9rem; }
.p-body { padding: .9rem 1.1rem 1.2rem; font-size: .9rem; }
.p-body h4 { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 1.1rem 0 .45rem; }
.p-body h4:first-child { margin-top: 0; }
.p-body p { margin: .4rem 0; }
.p-body ul, .p-body ol { margin: .3rem 0; padding-left: 1.2rem; }
.p-body li { margin: .2rem 0; }
.files { display: flex; flex-wrap: wrap; gap: .35rem; }
.files code { font-size: .78rem; }
.p-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; }
.btn { border: 1px solid var(--border); background: var(--surface-2); border-radius: 9px; padding: .45rem .8rem; cursor: pointer; font-size: .85rem; font-weight: 600; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn:hover { border-color: var(--primary); }

table { width: 100%; border-collapse: collapse; font-size: .82rem; margin: .4rem 0; }
th, td { text-align: left; padding: .35rem .45rem; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.sev { font-weight: 700; font-size: .78rem; }
.sev.h { color: var(--high); } .sev.m { color: var(--medium); } .sev.l { color: var(--muted); } .sev.p { color: var(--low); }
.callout { border-left: 3px solid var(--primary); background: var(--surface-2); padding: .55rem .75rem; border-radius: 0 8px 8px 0; margin: .6rem 0; }

/* Outline view */
.outline { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1rem 1.25rem; }
body.mode-outline .outline { display: block; }
body.mode-outline .graph-wrap { display: none; }
.outline details { margin: .15rem 0 .15rem .2rem; }
.outline details details { margin-left: 1.1rem; border-left: 1px dashed var(--border); padding-left: .7rem; }
.outline summary { cursor: pointer; padding: .3rem .2rem; border-radius: 6px; list-style: none; display: flex; gap: .5rem; align-items: baseline; }
.outline summary::-webkit-details-marker { display: none; }
.outline summary::before { content: "▸"; color: var(--muted); width: 1em; transition: transform .15s; }
.outline details[open] > summary::before { transform: rotate(90deg); }
.outline summary.leaf-s::before { content: "•"; }
.outline summary:hover { background: var(--surface-2); }
.outline .o-title { font-weight: 650; }
.outline .o-sub { color: var(--muted); font-size: .85rem; }
.outline .o-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--k); flex: none; align-self: center; }

footer.page-foot { max-width: 1440px; margin: 0 auto; padding: 1rem 16px 2rem; color: var(--muted); font-size: .8rem; text-align: center; }
@media (max-width: 600px) { .node { width: 100%; } .row { gap: 12px; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="logo">✓</div>
      <div>
        <h1>TrustCheck AI · How it works</h1>
        <p>Click any block to open it. Keep clicking to go deeper.</p>
      </div>
    </div>
    <div class="seg" role="tablist" aria-label="View">
      <button id="v-graph" class="on" role="tab" aria-selected="true">Flow graph</button>
      <button id="v-outline" role="tab" aria-selected="false">Full outline</button>
    </div>
    <button class="icon-btn" id="theme" title="Toggle theme">◐ Theme</button>
  </div>
</header>

<main class="shell">
  <section>
    <div class="graph-wrap">
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <div class="canvas" id="canvas"></div>
    </div>
    <div class="outline" id="outline"></div>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<footer class="page-foot">TrustCheck AI · college hackathon project by Ashad Abbas · Rules decide. AI explains. You verify.</footer>

  'ep-samples': { title: 'GET /samples', kind: 'api', icon: '🧪', sub: 'Demo texts per mode.', body: `<p>Returns sample messages filtered by <code>?mode=</code>. Each has an id, label, description, expected level and text.</p>`, files: ['BE/src/samples.ts'] },

    body: `<p>The orchestrator runs one analysis.</p>

  'or-cache': { title: 'Result cache', kind: 'data', icon: '⚡', sub: 'Saves free-tier LLM quota.', body: `<p>An in-memory <code>Map</code> keyed by <code>sha1(mode:provider:model:text)</code>. Only results where the LLM succeeded are cached. A hit returns a copy with a fresh id and timestamp. Repeated demo runs cost nothing.</p>`, files: ['BE/src/analyze.ts'] },
  'or-route': { title: 'Route by mode', kind: 'engine', icon: '⑂', sub: 'scam → links + scam rules · ai → AI rules.', body: `<p>Scam mode runs the URL checker first, because the link signal is derived from link verdicts. AI mode skips links entirely.</p>`, files: ['BE/src/analyze.ts'] },
  'or-merge': { title: 'Merge', kind: 'engine', icon: '⊕', sub: 'LLM text replaces rule text where present.', body: `<p>For each signal, <code>explanation</code> and <code>lesson</code> are replaced by the LLM version when one exists for that id. Score, level, severity and spans always come from the rules.</p>`, files: ['BE/src/analyze.ts'] },

    body: `<ul><li>With scheme: always a link.</li><li>Without scheme: only if the last label is a known TLD, so <code>B.Tech</code> and <code>8.5</code> are ignored.</li><li>Skipped when glued to <code>@</code>, which drops emails and UPI IDs.</li><li>Trailing punctuation is stripped. Duplicates are removed.</li></ul>`, files: ['BE/src/urlcheck.ts'] },
  'lk-heur': { title: 'Heuristics', kind: 'link', icon: '🧮', sub: 'Shorteners, IPs, cheap TLDs, trust words.',
    body: `<table><tr><th>Check</th><th>Points</th></tr>

  'lk-sb': { title: 'Google Safe Browsing', kind: 'link', icon: '🛡', sub: 'Optional real blocklist lookup.', body: `<p>If <code>SAFE_BROWSING_API_KEY</code> is set, all URLs are sent in one Lookup API v4 request for malware, social engineering and unwanted software. A match sets the verdict to <b>flagged</b>. 5-second timeout. Failure is ignored.</p>`, files: ['BE/src/urlcheck.ts', '.env'] },
  'lk-verdict': { title: 'Verdict → link signal', kind: 'link', icon: '⚑', sub: 'Worst link sets the weight.',
    body: `<table><tr><th>Verdict</th><th>Signal weight</th></tr><tr><td>likely-official</td><td>0, no signal</td></tr><tr><td>unverified</td><td>+6</td></tr><tr><td>suspicious</td><td>+12</td></tr><tr><td>flagged</td><td>+30</td></tr></table><p>The link signal uses the URL spans from extraction, so the exact link is highlighted.</p>`, files: ['BE/src/rules/index.ts'] },

    body: `<p>Each rule is a list of regexes with a fixed weight, severity, explanation, lesson and verification tip. Matches become highlighted spans. Overlapping spans are merged.</p>

  'sr-contact': { title: 'Contact channel', kind: 'engine', icon: '✉', sub: 'Free email, chat-only, generic greeting.',
    body: `<table><tr><th>Rule</th><th>Sev</th><th>Wt</th></tr>

  'sr-legit': { title: 'Legitimacy indicators', kind: 'engine', icon: '✔', sub: 'Negative weights pull the score down.',
    body: `<table><tr><th>Indicator</th><th>Wt</th></tr>
      <tr><td>Official domain: .ac.in .edu .gov.in .nic.in</td><td class="sev p">−15</td></tr>
      <tr><td>"No fee" / "free of cost"</td><td class="sev p">−10</td></tr>

  'scam-bonus': { title: 'Combination bonuses', kind: 'engine', icon: '✚', sub: 'Dangerous pairs add +8 each.',
    body: `<ul><li>Upfront payment + artificial urgency</li><li>Upfront payment + untraceable channel</li><li>Sensitive data + link</li><li>Authority name + upfront payment</li></ul><p>Scams rarely use one trick. Pairs are much stronger evidence than either alone.</p>`, files: ['BE/src/rules/index.ts'] },

  /* ---------------- AI mode ---------------- */
  aimode: {

    rows: [['ai-patterns', 'ai-stats'], ['ai-human'], ['ai-score']], edges: ['', 'net points'],
    body: `<p>Looks for documented habits of LLM output and for traces of a human voice. Rules come from Wikipedia’s <i>Signs of AI writing</i> field guide and detector write-ups.</p>
      <div class="callout"><b>Not a detector.</b> Formal or non-native human writing triggers many cues. Output is a conversation starter, never proof.</div>

    files: ['BE/src/airules/signals.ts', 'BE/src/airules/stats.ts', 'BE/src/airules/index.ts'] },
  'ai-patterns': {
    title: 'Pattern rules', kind: 'ai', icon: '🔍', sub: '14 phrase and formatting rules.',
    rows: [['ap-hard'], ['ap-vocab', 'ap-struct', 'ap-format']], edges: [''],
    body: `<p>Regex rules over the raw text. Matches are highlighted like scam evidence.</p>`, files: ['BE/src/airules/signals.ts'] },
  'ap-hard': { title: 'Hard artifacts', kind: 'ai', icon: '⛔', sub: 'Near-certain evidence of a paste.',
    body: `<table><tr><th>Signal</th><th>Per / cap</th></tr>

  'ap-vocab': { title: 'Vocabulary', kind: 'ai', icon: '📚', sub: 'delve, tapestry, testament, pivotal …',

  'ap-struct': { title: 'Structure', kind: 'ai', icon: '🏗', sub: 'Parallelisms, triplets, transitions.',
    body: `<table><tr><th>Signal</th><th>Per / cap</th></tr>

  'ap-format': { title: 'Formatting', kind: 'ai', icon: '✱', sub: 'Markdown, em dashes, curly quotes.',
    body: `<table><tr><th>Signal</th><th>Per / cap</th></tr>

  'ai-stats': {
    title: 'Statistics', kind: 'ai', icon: '📊', sub: 'Burstiness, paragraphs, register.',
    rows: [['st-split'], ['st-burst', 'st-para', 'st-reg']], edges: ['sentences + words'],
    body: `<p>Whole-text measurements with no spans to highlight. They show in the evidence list with a numeric explanation.</p>`, files: ['BE/src/airules/stats.ts'] },
  'st-split': { title: 'Split sentences', kind: 'ai', icon: '✂', sub: 'Sentences of 2+ words; word count.', body: `<p>Text is split on <code>. ! ?</code> and newlines. Fragments under two words are dropped. Under 50 words a <b>Too little text</b> info signal is added.</p>`, files: ['BE/src/airules/stats.ts'] },
  'st-burst': { title: 'Burstiness', kind: 'ai', icon: '〰', sub: 'Variation in sentence length.',
    body: `<p>Coefficient of variation = standard deviation ÷ mean of sentence lengths. Needs 5+ sentences.</p>
      <table><tr><th>CV</th><th>Signal</th><th>Wt</th></tr><tr><td>&lt; 0.30</td><td>Very uniform</td><td>+18</td></tr><tr><td>&lt; 0.45</td><td>Fairly uniform</td><td>+9</td></tr><tr><td>&gt; 0.70</td><td>Bursty, human-like</td><td class="sev p">−10</td></tr></table>
      <p>Humans write a long sentence, then a short one. Models keep a steady rhythm.</p>`, files: ['BE/src/airules/stats.ts'] },
  'st-para': { title: 'Paragraphs & openers', kind: 'ai', icon: '¶', sub: 'Uniform sizes, never-repeating starts.',
    body: `<ul><li><b>Evenly sized paragraphs</b>: 3+ paragraphs of 15+ words with CV &lt; 0.25 → +8.</li><li><b>Every sentence opens differently</b>: 8+ sentences, over 90% distinct first words → +6.</li></ul>`, files: ['BE/src/airules/stats.ts'] },
  'st-reg': { title: 'Register', kind: 'ai', icon: '🎚', sub: 'No contractions, no first person.',
    body: `<p>Only for texts of 120+ words.</p><ul><li>Zero contractions → +7.</li><li>No I / my / we → +5, info severity because reports are impersonal by design.</li></ul>`, files: ['BE/src/airules/stats.ts'] },
  'ai-human': { title: 'Human counter-signals', kind: 'actor', icon: '🙂', sub: 'Slang, typos, personal detail lower the score.',
    body: `<table><tr><th>Signal</th><th>Per / cap</th></tr>

  'ai-score': { title: 'AI score & caps', kind: 'ai', icon: '🎯', sub: 'Bonuses, same curve, short-text cap.',

/* ------------------------------------------------------------------------ */
const $ = (s) => document.querySelector(s);
const canvas = $('#canvas'), panel = $('#panel'), crumbs = $('#crumbs');
let path = ['root'];
let selected = 'root';

function parentOf(id) {
  for (const [pid, n] of Object.entries(N)) if (n.rows && n.rows.flat().includes(id)) return pid;
  return null;
}
function pathTo(id) {
  const p = [];
  let cur = id;
  while (cur) { p.unshift(cur); cur = parentOf(cur); }
  return p;
}
const hasKids = (id) => !!(N[id].rows && N[id].rows.flat().length);
const kidCount = (id) => (N[id].rows ? N[id].rows.flat().length : 0);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function arrow(label) {
  return `<div class="connector" aria-hidden="true">
    <svg width="14" height="38" viewBox="0 0 14 38"><path d="M7 0 V30"/><path class="head" d="M1 28 L7 37 L13 28 Z"/></svg>
    ${label ? `<span class="tag">${esc(label)}</span>` : ''}</div>`;
}

function nodeCard(id) {
  const n = N[id];
  const kids = kidCount(id);
  return `<button class="node k-${n.kind} ${selected === id ? 'selected' : ''}" data-id="${id}" aria-label="${esc(n.title)}">
    <div class="n-top"><span class="n-icon">${n.icon}</span><span class="n-title">${esc(n.title)}</span></div>
    <div class="n-sub">${esc(n.sub)}</div>
    <div class="n-foot"><span class="chip">${KIND_LABEL[n.kind]}</span>${kids ? `<span class="drill">${kids} inside ›</span>` : `<span class="leaf">details ›</span>`}</div>
  </button>`;
}

function renderCanvas(direction) {
  const id = path[path.length - 1];
  const n = N[id];
  const rows = n.rows || [];
  let flow = '';
  rows.forEach((row, i) => {
    if (i > 0) flow += arrow(n.edges?.[i - 1] || '');
    flow += `<div class="row">${row.map(nodeCard).join('')}</div>`;
  });
  const kinds = [...new Set(rows.flat().map((k) => N[k].kind))];
  canvas.innerHTML = `
    <div class="level-head">
      <div class="lh-icon k-${n.kind}" style="background:var(--k)">${n.icon}</div>
      <div><h2>${esc(n.title)}</h2><p>${esc(n.sub)}</p></div>
      ${path.length > 1 ? `<button class="btn up-btn" id="up">↑ Up a level</button>` : ''}
    </div>
    <div class="flow ${direction || ''}">${flow}</div>
    <div class="legend">${kinds.map((k) => `<span class="k-${k}"><i></i>${KIND_LABEL[k]}</span>`).join('')}</div>
    <p class="hint">Click a block to open it. Blocks with a coloured badge contain a deeper flow. Esc goes back.</p>`;
  const up = $('#up');
  if (up) up.onclick = goUp;
}

function renderCrumbs() {
  crumbs.innerHTML = path
    .map((id, i) => (i === path.length - 1 ? `<span class="cur">${esc(N[id].title)}</span>` : `<button data-depth="${i}">${esc(N[id].title)}</button><span class="sep">›</span>`))
    .join('');
}

function renderPanel() {
  const n = N[selected];
  const isLevel = selected === path[path.length - 1];
  const parent = parentOf(selected);
  const kidsList = hasKids(selected) ? n.rows.flat().map((k) => `<li><a href="#${k}" data-jump="${k}">${esc(N[k].title)}</a> <span style="color:var(--muted)">— ${esc(N[k].sub)}</span></li>`).join('') : '';
  panel.innerHTML = `
    <div class="p-head k-${n.kind}" style="--k:var(--k-${n.kind})">
      <span class="chip">${KIND_LABEL[n.kind]}</span>
      <h3>${n.icon} ${esc(n.title)}</h3>
      <p>${esc(n.sub)}</p>
    </div>
    <div class="p-body">
      ${n.body || ''}
      ${n.files?.length ? `<h4>Source files</h4><div class="files">${n.files.map((f) => `<code>${esc(f)}</code>`).join('')}</div>` : ''}
      ${kidsList ? `<h4>Inside this block</h4><ul>${kidsList}</ul>` : ''}
      <div class="p-actions">
        ${hasKids(selected) && !isLevel ? `<button class="btn primary" data-open="${selected}">Open flow ›</button>` : ''}
        ${parent ? `<button class="btn" data-jump="${parent}">↑ ${esc(N[parent].title)}</button>` : ''}
        ${selected !== 'root' ? `<button class="btn" data-jump="root">⌂ Overview</button>` : ''}
      </div>
    </div>`;
  panel.scrollTop = 0;
}

function render(direction) {
  renderCrumbs();
  renderCanvas(direction);
  renderPanel();
  const h = '#' + selected;
  if (location.hash !== h) history.replaceState(null, '', h);
}

/* Click on a block: always show its explanation; drill in if it has a sub-flow. */
function openNode(id) {
  if (!N[id]) return;
  selected = id;
  if (hasKids(id)) {
    path = pathTo(id);
    render('enter');
  } else {
    const p = pathTo(id);
    path = p.slice(0, -1);
    render();
  }
}
function jumpTo(id) {
  if (!N[id]) return;
  const p = pathTo(id);
  path = hasKids(id) ? p : p.slice(0, -1);
  selected = id;
  render('leave');
}
function goUp() {
  if (path.length <= 1) return;
  const left = path[path.length - 1];
  path = path.slice(0, -1);
  selected = left;
  render('leave');
}

canvas.addEventListener('click', (e) => {
  const b = e.target.closest('.node');
  if (b) openNode(b.dataset.id);
});
crumbs.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-depth]');
  if (!b) return;
  path = path.slice(0, Number(b.dataset.depth) + 1);
  selected = path[path.length - 1];
  render('leave');
});
panel.addEventListener('click', (e) => {
  const o = e.target.closest('[data-open]');
  if (o) { e.preventDefault(); openNode(o.dataset.open); return; }
  const j = e.target.closest('[data-jump]');
  if (j) { e.preventDefault(); const id = j.dataset.jump; hasKids(id) && pathTo(id).length > path.length ? openNode(id) : jumpTo(id); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !document.body.classList.contains('mode-outline')) goUp();
});

/* Outline view */
function outlineNode(id, depth) {
  const n = N[id];
  const kids = n.rows ? n.rows.flat() : [];
  const head = `<span class="o-dot k-${n.kind}"></span><span class="o-title">${n.icon} ${esc(n.title)}</span><span class="o-sub">— ${esc(n.sub)}</span>`;
  if (!kids.length) return `<details><summary class="leaf-s" data-oid="${id}">${head}</summary></details>`;
  return `<details ${depth < 1 ? 'open' : ''}><summary data-oid="${id}">${head}</summary>${kids.map((k) => outlineNode(k, depth + 1)).join('')}</details>`;
}
$('#outline').innerHTML = `<div style="display:flex;gap:.5rem;margin-bottom:.6rem"><button class="btn" id="ex-all">Expand all</button><button class="btn" id="co-all">Collapse all</button></div>` + outlineNode('root', 0);
$('#outline').addEventListener('click', (e) => {
  const s = e.target.closest('summary[data-oid]');
  if (s) { selected = s.dataset.oid; renderPanel(); }
});
$('#ex-all').onclick = () => document.querySelectorAll('#outline details').forEach((d) => (d.open = true));
$('#co-all').onclick = () => document.querySelectorAll('#outline details').forEach((d, i) => (d.open = i === 0));

function setView(v) {
  document.body.classList.toggle('mode-outline', v === 'outline');
  $('#v-graph').classList.toggle('on', v === 'graph');
  $('#v-outline').classList.toggle('on', v === 'outline');
  $('#v-graph').setAttribute('aria-selected', v === 'graph');
  $('#v-outline').setAttribute('aria-selected', v === 'outline');
  if (v === 'graph') render();
}
$('#v-graph').onclick = () => setView('graph');
$('#v-outline').onclick = () => setView('outline');

/* Theme toggle (remembers choice when storage is available) */
function applyTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
try { applyTheme(localStorage.getItem('tc-theme')); } catch { /* storage blocked */ }
$('#theme').onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('tc-theme', next); } catch { /* ignore */ }
};

/* Deep links: how-it-works.html#ai-stats */
const start = location.hash.slice(1);
if (start && N[start]) jumpTo(start); else render('enter');
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (N[id] && id !== selected) jumpTo(id); });
</script>
